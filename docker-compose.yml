# Local Postgres for development and tests. Production uses Neon.
services:
  db:
    image: postgres:17-alpine
    ports:
      - '54329:5432'
    environment:
      POSTGRES_USER: reachin
      POSTGRES_PASSWORD: reachin
      POSTGRES_DB: reachin
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reachin']
      interval: 2s
      timeout: 2s
      retries: 20
